name: Deploy Chinese Oral V6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate V6 site
        shell: bash
        run: |
          set -e
          mkdir -p site
          cp chinese-oral-site/index.html site/index.html
          cp chinese-oral-patch/enhancements.css site/enhancements.css
          cp chinese-oral-patch/enhancements.js site/enhancements.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>','<link rel="stylesheet" href="enhancements.css?v=6"></head>')
          s=s.replace('</body>','<script src="enhancements.js?v=6"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
          node --check site/enhancements.js
          grep -q 'enhancements.css' site/index.html
          grep -q 'enhancements.js' site/index.html
          cat > site/netlify.toml <<'EOF'
          [build]
            publish = "."
          [[headers]]
            for = "/*"
            [headers.values]
              Cache-Control = "no-cache, no-store, must-revalidate"
          EOF
      - name: Smoke-test reading and oral interactions
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install jsdom@26 --no-audit --no-fund >/dev/null 2>&1
          cat > /tmp/qa.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {JSDOM,VirtualConsole} from 'jsdom';
          let html=fs.readFileSync('site/index.html','utf8');
          const css=fs.readFileSync('site/enhancements.css','utf8');
          const js=fs.readFileSync('site/enhancements.js','utf8');
          html=html.replace('<link rel="stylesheet" href="enhancements.css?v=6">',`<style>${css}</style>`).replace('<script src="enhancements.js?v=6"></script>',`<script>${js}</script>`);
          const warnings=[];const vc=new VirtualConsole();vc.on('jsdomError',e=>warnings.push(String(e)));
          const dom=new JSDOM(html,{runScripts:'dangerously',url:'https://school.test/',virtualConsole:vc,beforeParse(w){
            w.SpeechSynthesisUtterance=function(text){this.text=text};
            w.speechSynthesis={speak(){},cancel(){}};
            Object.defineProperty(w.navigator,'mediaDevices',{value:{getUserMedia:async()=>({getTracks:()=>[{stop(){}}]})}});
            w.URL.createObjectURL=()=> 'blob:test-audio';
            w.MediaRecorder=class{constructor(s){this.stream=s;this.state='inactive';this.mimeType='audio/webm'}start(){this.state='recording'}stop(){this.state='inactive';this.ondataavailable?.({data:new w.Blob(['audio'],{type:'audio/webm'})});setTimeout(()=>this.onstop?.(),0)}};
            w.webkitSpeechRecognition=class{start(){}stop(){}};
          }});
          await new Promise(r=>setTimeout(r,120));const d=dom.window.document;
          if(warnings.length) console.log('Ignored jsdom-only warnings:',warnings.join(' | '));
          assert.equal(d.querySelector('#passageTitle').textContent,'营地里的第一晚');
          assert.equal(d.querySelectorAll('.target-word').length,10);
          assert.equal(d.querySelectorAll('#wordChips .word-chip').length,10);
          assert.ok(d.querySelector('#readTranscript').closest('.transcript-wrap'));
          console.log('QA checkpoint: reading content and labels');
          d.querySelector('[data-tab="reading"]').click();
          d.querySelector('#readAloud').click();assert.match(d.querySelector('#readAloud').textContent,/停止范读/);
          d.querySelector('#readAloud').click();assert.match(d.querySelector('#readAloud').textContent,/播放范读/);
          console.log('QA checkpoint: reading play and stop');
          d.querySelector('#readRecord').click();await new Promise(r=>setTimeout(r,30));
          assert.ok(!d.querySelector('#readRecordState').classList.contains('hidden-v6'));
          assert.match(d.querySelector('#readRecord').textContent,/结束录音/);
          d.querySelector('#readRecord').click();await new Promise(r=>setTimeout(r,300));
          assert.ok(!d.querySelector('#readAudio').classList.contains('hidden'));
          assert.match(d.querySelector('#readResult').textContent,/录音已保存/);
          console.log('QA checkpoint: reading recording and fallback feedback');
          d.querySelector('[data-tab="oral"]').click();
          const replies=['我认为独立很重要，因为可以培养责任感。例如我会自己整理书包。','我会先鼓励朋友从小事开始，因为这样比较容易坚持。','家长可以给孩子适当任务，如果孩子遇到困难，可以引导而不是代劳。'];
          for(let i=0;i<3;i++){let ta=d.querySelector(`[data-text="${i}"]`);ta.value=replies[i];ta.dispatchEvent(new dom.window.Event('input',{bubbles:true}));d.querySelector(`[data-save="${i}"]`).click();await new Promise(r=>setTimeout(r,20));}
          assert.ok(!d.querySelector('#overall').classList.contains('hidden'));
          const details=d.querySelector('#sample').closest('details');assert.equal(details.hidden,false);
          assert.ok(d.querySelectorAll('.question-feedback').length>=3);
          d.querySelector('#sampleAudio').click();assert.match(d.querySelector('#sampleAudio').textContent,/停止完整参考答案/);
          console.log('V6 interaction QA passed');
          JS
          node /tmp/qa.mjs
      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..VBJJeN-1gVjZxLfs.eOE85Kvfd0laevjU4Q_7QDaiz3YLc-4D8Dw0K0WDyo-ChExPHQc0am-FK4PLQtSUH8mGEAbaWmVwHzV-NNsDXJvHBlyVTcZTsvw9g6lOqAZAZ5Zi0M37xpm-DPVwtrYWTbN-u306q83vr3yIivUcJoCAFKglCKfH_n1GyFi0LO7Ce-F7Ff-eBGF_Juv4KLq0kNYjzxiEfgeoLgj1KbZTeId30I2XMJAc5wLr2Mi-sLJ72DKTOKTL0tcoBtPdbUz4u4orF9Elu9M4Xi-cOKgU5K0jehU5HGWsBvsjFFaQ-Oeuf0vPmj0rG_UwIGmAEugVQd5EpvXnaLe0LP6AbKhU_LEdJGQeFjnq4_naz6G4t_zRXLTEKZiJkiCW0BUC2YWdrZw3u5sH.u-IhiZ-Ed-4m8-Zl-wradw" \
            --no-wait 2>&1 | tee /tmp/netlify-v6.log
      - name: Post deployment log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Chinese Oral V6 deployment output'
            echo '```text'
            tail -80 /tmp/netlify-v6.log 2>/dev/null || echo 'No deploy log was produced.'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail if deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
