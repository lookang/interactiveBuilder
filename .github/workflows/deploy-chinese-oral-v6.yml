name: Deploy Chinese Oral V6

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate V6 site
        shell: bash
        run: |
          set -e
          mkdir -p site
          cp chinese-oral-site/index.html site/index.html
          cp chinese-oral-patch/enhancements.css site/enhancements.css
          cp chinese-oral-patch/enhancements.js site/enhancements.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('</head>','<link rel="stylesheet" href="enhancements.css?v=6"></head>')
          s=s.replace('</body>','<script src="enhancements.js?v=6"></script></body>')
          p.write_text(s,encoding='utf-8')
          PY
          node --check site/enhancements.js
          grep -q 'enhancements.css' site/index.html
          grep -q 'enhancements.js' site/index.html
          cat > site/netlify.toml <<'EOF'
          [build]
            publish = "."
          [[headers]]
            for = "/*"
            [headers.values]
              Cache-Control = "no-cache, no-store, must-revalidate"
          EOF
      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..IZl5-2VVHwqUxUIL.vyGuRxdD7dQsp7ryvU5ripTGV2AMJJLrLZQNWf0t6Oqb8LI--C_PdhV3ZfF83PG181mjc0qFGp2fLd_bK0h0ipaVVuNUIngFJ2khQU26Ieh71Vlcf50DSeC7llZ8U9VfwRH_X9EPq-ljchMKySKY_X69XCJ-KRrZnRhJBo9-hcsHdKsXXM2BZiI9KHXYSdTR8sVkC0nVHigXjvbpSn6t6wfpluC3KGlpDFlVt1uMX2E2eOCqFE43lDs6-pzhYnqdObsTbyF-MrIbjOqegAfENkpS3__4RDuMFEZVnEYJfzbpT-6iMm1CDh5r8PIukdq-7MVqGRMOf_X_rU5Sd0mIQiSPtQpaktb_ED51S4UXgcEQ9LhXUOgWtjShWXbFEySLYCXlHBeR.OD3fATtzWLcLFQlFqXWWGg" \
            --no-wait 2>&1 | tee /tmp/netlify-v6.log
      - name: Post deployment log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Chinese Oral V6 deployment output'
            echo '```text'
            tail -80 /tmp/netlify-v6.log 2>/dev/null || echo 'No deploy log was produced.'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail if deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
