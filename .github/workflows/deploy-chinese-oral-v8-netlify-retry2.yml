name: Deploy Chinese Oral V8 to Netlify Retry 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate final site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
          gzip -t /tmp/chinese-oral-final.tar.gz
          mkdir -p final-site
          tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site
          cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
          patch -d final-site -p1 < /tmp/dashboard-v8.patch
          node --check final-site/public/app.js
          grep -q 'openTeacherDashboard' final-site/public/index.html
          grep -q 'teacher-dashboard-modal' final-site/public/styles.css
          test -f final-site/netlify/functions/progress.mts

      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: final-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..28Y9OlvEXtZk6BLw.6LhFOCyHY_Ebz6tEnW7Q2SpJQ3XbSwC1UMqf8bPY8B9J29E2cDgIQ_lAXF4XKA5tYNrs_qZiEwkiWFpOpl9CgQmg4IZAOb-4msIwflvZE2lNvNAMlFRhFd2AYSvmFw6_wJct_zrST33EecLDwIUl8ZNjY04lkVwErKh0EdU2N8BplinjR4ywKsc6eht7CnMlXuPl6v9wMT20rPNw9LJbaqXFy8fpZ-JmoXVbYKnzjs54jhf1fg-dwwH5N2pT0RxL21jJvN5_zJZ6NtsttyIg79oSQS1NLhlEOwDABN6IyCQpO_PLtsfE9MfKTFArXhhP7WftDo1xxPwJUImMGlqBcJ67t-PL46Lfbz_BMgICuaNUd44rT5YzPI8ZY3DXR7DnYEYr2n1p.ajll0xnwxwFw4QrT0Ok80A" \
            --no-wait 2>&1 | tee /tmp/netlify-v8-retry2.log

      - name: Post deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral V8 Netlify retry 2 output'
            echo '```text'
            tail -100 /tmp/netlify-v8-retry2.log 2>/dev/null || echo 'No deployment output was produced.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/deploy-comment.md

      - name: Fail when deployment command failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
