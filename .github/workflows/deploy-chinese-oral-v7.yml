name: Deploy Chinese Oral V7

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild V7 site
        id: rebuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -x
            pwd
            ls -la deploy-v7
            wc -c deploy-v7/part-[0-9][0-9]
            cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-v7.tar.gz
            ls -l /tmp/chinese-oral-v7.tar.gz
            gzip -t /tmp/chinese-oral-v7.tar.gz
            mkdir -p v7-site
            tar -xzf /tmp/chinese-oral-v7.tar.gz -C v7-site
            find v7-site -maxdepth 3 -type f -print
          } 2>&1 | tee /tmp/rebuild-v7.log

      - name: Post rebuild result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral V7 rebuild output'
            echo '```text'
            tail -100 /tmp/rebuild-v7.log 2>/dev/null || echo 'No rebuild output.'
            echo '```'
          } > /tmp/rebuild-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/rebuild-comment.md

      - name: Deploy to Netlify
        id: deploy
        if: steps.rebuild.outcome == 'success'
        continue-on-error: true
        working-directory: v7-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..Ue2fzrp5tG_CDJkz.Bxk_7E6uMtYU-n7AO0eG4Pi1pLnJMMA2KlZfrXo-4hyIH3oDiBHGrSi_fnBGSdze2jva7DswPbURejTKhn5ypvQvi1JwCb8sKQsmhFoDV5nA4mdpUxn-zxLbp6Z_qTznBY1p4GlIKApUVO8spGSrRGdDSd0iz48_vik0XO0iPxkmJAOQE5rhOGu1mQNcPIBRx_Zvl_jjk-sjw0zt6IWqs5-MLAgdsSRtjBhq6DKyY49juQI2kQ8Xk-D16m57wbTqR-5XAA1HtZrLANLtKTMxQAjGvg-WMeBxyhgQv5pJaa2iLtVGiK0h-fM1lKNddhBUokBH4DAogRpB05FLGcnlHji9H6-qjhry0pzsZ50cEtB_TYMMeIFDedShWY4YHWHPZQAJAdq7.ugXipmOavRwQtvg2_cXBEA" \
            --no-wait 2>&1 | tee /tmp/netlify-v7.log

      - name: Post deploy result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral V7 deployment output'
            echo '```text'
            tail -80 /tmp/netlify-v7.log 2>/dev/null || echo 'Deployment was skipped because rebuilding failed.'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md

      - name: Fail when rebuild or deployment failed
        if: steps.rebuild.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: exit 1
