name: Publish Chinese Oral Final Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate final site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
          gzip -t /tmp/chinese-oral-final.tar.gz
          mkdir -p final-site
          tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site
          cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
          patch -d final-site -p1 < /tmp/dashboard-v8.patch
          node --check final-site/public/app.js
          grep -q 'openTeacherDashboard' final-site/public/index.html
          grep -q 'teacher-dashboard-modal' final-site/public/styles.css
          touch final-site/public/.nojekyll

      - name: Publish HTTPS preview branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-preview
          mkdir -p /tmp/final-preview
          cp -a final-site/public/. /tmp/final-preview/
          cd /tmp/final-preview
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish final Chinese oral app preview"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/chinese-oral-v8-preview-site

      - name: Post preview link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/comment.md <<'EOF'
          ### Chinese Oral final HTTPS preview

          https://raw.githack.com/lookang/interactiveBuilder/chinese-oral-v8-preview-site/index.html

          Teacher dashboard: select `教师进度` at the top right.
          Teacher code: `FNDMSMXMT5`

          This preview stores and displays profiles from the same browser. The central Netlify deployment remains blocked by the Netlify account/deployment service.
          EOF
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
