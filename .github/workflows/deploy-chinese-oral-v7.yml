name: Deploy Chinese Oral Final

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate final site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
          gzip -t /tmp/chinese-oral-final.tar.gz
          mkdir -p final-site
          tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site
          cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
          patch -d final-site -p1 < /tmp/dashboard-v8.patch
          node --check final-site/public/app.js
          grep -q 'openTeacherDashboard' final-site/public/index.html
          grep -q 'teacher-dashboard-modal' final-site/public/styles.css
          test -f final-site/netlify/functions/progress.mts

      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: final-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..Ue2fzrp5tG_CDJkz.Bxk_7E6uMtYU-n7AO0eG4Pi1pLnJMMA2KlZfrXo-4hyIH3oDiBHGrSi_fnBGSdze2jva7DswPbURejTKhn5ypvQvi1JwCb8sKQsmhFoDV5nA4mdpUxn-zxLbp6Z_qTznBY1p4GlIKApUVO8spGSrRGdDSd0iz48_vik0XO0iPxkmJAOQE5rhOGu1mQNcPIBRx_Zvl_jjk-sjw0zt6IWqs5-MLAgdsSRtjBhq6DKyY49juQI2kQ8Xk-D16m57wbTqR-5XAA1HtZrLANLtKTMxQAjGvg-WMeBxyhgQv5pJaa2iLtVGiK0h-fM1lKNddhBUokBH4DAogRpB05FLGcnlHji9H6-qjhry0pzsZ50cEtB_TYMMeIFDedShWY4YHWHPZQAJAdq7.ugXipmOavRwQtvg2_cXBEA" \
            --no-wait 2>&1 | tee /tmp/netlify-final.log

      - name: Post deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral final deployment output'
            echo '```text'
            tail -100 /tmp/netlify-final.log 2>/dev/null || echo 'No deployment output was produced.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/deploy-comment.md

      - name: Fail when deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
