name: Publish Chinese Oral V7 Test Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild V7 site
        shell: bash
        run: |
          set -e
          cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-v7.tar.gz
          gzip -t /tmp/chinese-oral-v7.tar.gz
          mkdir -p v7-site
          tar -xzf /tmp/chinese-oral-v7.tar.gz -C v7-site
          node --check v7-site/public/app.js
          node --check v7-site/public/teacher.js

      - name: Add same-browser dashboard fallback for test preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v7-site/public/teacher.js')
          s=p.read_text(encoding='utf-8')
          a=s.index('async function load()')
          b=s.index('function filtered()',a)
          replacement='''async function load(){\n  let data=null;\n  try{const r=await fetch('/api/progress',{headers:{'x-teacher-code':code}});if(r.ok)data=await r.json();}\n  catch{}\n  if(!data){\n    if(code!=="FNDMSMXMT5")throw new Error('教师代码不正确。');\n    try{profiles=Object.values(JSON.parse(localStorage.getItem('oralAppProfilesV4')||'{}'));}catch{profiles=[];}\n    data={updatedAt:new Date().toISOString()};\n    $('#loginMessage').textContent='试用预览：这里只显示同一浏览器中保存的学生档案。正式云端看板会汇总不同学生设备。';\n  }else{profiles=data.profiles||[];$('#loginMessage').textContent='';}\n  sessionSet('teacherDashboardCode',code);$('#loginPanel').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#updatedAt').textContent=`最后更新：${fmt(data.updatedAt)}`;renderFilters();render();\n}\n'''
          p.write_text(s[:a]+replacement+s[b:],encoding='utf-8')
          PY
          node --check v7-site/public/teacher.js
          touch v7-site/public/.nojekyll

      - name: Publish HTTPS test branch
        shell: bash
        run: |
          set -e
          rm -rf /tmp/v7-preview
          mkdir -p /tmp/v7-preview
          cp -a v7-site/public/. /tmp/v7-preview/
          cd /tmp/v7-preview
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish Chinese oral V7 test preview"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/chinese-oral-v7-preview-site

      - name: Post preview links
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/comment.md <<'EOF'
          ### Chinese Oral V7 HTTPS test preview

          Student app:
          https://raw.githack.com/lookang/interactiveBuilder/chinese-oral-v7-preview-site/index.html

          Same-browser teacher dashboard preview:
          https://raw.githack.com/lookang/interactiveBuilder/chinese-oral-v7-preview-site/teacher.html

          Teacher code: `FNDMSMXMT5`

          Note: the test dashboard shows profiles saved in the same browser. The central cross-device Netlify dashboard could not be published because the Netlify account reported that its deployment credits were exceeded.
          EOF
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
