name: Deploy Chinese Oral V9 to Netlify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate V9 site
        id: rebuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
            gzip -t /tmp/chinese-oral-final.tar.gz
            mkdir -p final-site
            tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site

            cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
            patch -d final-site -p1 < /tmp/dashboard-v8.patch

            cat deploy-v9/part-* | base64 -d | gzip -d > /tmp/v9-full.patch
            python - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/v9-full.patch').read_text(encoding='utf-8')
          chunks = re.split(r'(?=^diff -ruN )', source, flags=re.M)
          keep = []
          for chunk in chunks:
              first = chunk.splitlines()[0] if chunk.splitlines() else ''
              if ' a/public/' in first or ' a/netlify/' in first:
                  keep.append(chunk)
          Path('/tmp/v9-deploy.patch').write_text(''.join(keep), encoding='utf-8')
          PY
            wc -c /tmp/v9-deploy.patch
            patch --batch -d final-site -p1 < /tmp/v9-deploy.patch

            node --check final-site/public/app.js
            grep -q '学习进度排行榜' final-site/public/index.html
            grep -q 'CLOUD_TRANSCRIBE_ENDPOINT' final-site/public/app.js
            test -f final-site/netlify/functions/progress.mts
            test -f final-site/netlify/functions/transcribe.mts
          } 2>&1 | tee /tmp/rebuild-v9.log

      - name: Deploy V9 to Netlify
        id: deploy
        if: steps.rebuild.outcome == 'success'
        continue-on-error: true
        working-directory: final-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..6KFpqHbx60bE4q7a.3SE061fMXvzjuErl-mYGQ-g3sGTM0m-_iOMlSrxx-v28FMOs1HTQLlKDqRsyf7HlKVlCX_dYj9xYsBycTM-76QHXiAu3n_7DsZKhGVkMoPru7rCYZ3wyLJ7pMWzq3NYdyXb2eZOdiZW4ePpKfbS-lMEKmP3hn5mYFVQV_sBsZFcEG5XTZqJKTXKHuyPuxXLy_S51lbc7LRNzFmzUnB0wMxUSVZ9Lg41PBhrrYSVrYn4iT5jsGhYfGSMdcq-6D2YU9WUHZ1PcYfDt8fy4L2unH1uLAeuJ673fkHeZO0MHBysvNMw5IajmUD9tQJAciIc6UlbaZ-wb2YDmiZ42TmRFdNshjvjvj0zc2IJEJXhPAgrtBKySkRPdR9q8e5GihAsMtOVFTr5s.Td7Nwv7LUTzzs0QNSWd-rQ" \
            --no-wait 2>&1 | tee /tmp/netlify-v9.log

      - name: Post deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral V9 build and deployment output'
            echo '#### Rebuild'
            echo '```text'
            tail -120 /tmp/rebuild-v9.log 2>/dev/null || echo 'No rebuild output was produced.'
            echo '```'
            echo '#### Netlify'
            echo '```text'
            tail -100 /tmp/netlify-v9.log 2>/dev/null || echo 'Deployment was not started.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/deploy-comment.md

      - name: Fail when build or deployment failed
        if: steps.rebuild.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: exit 1
