name: Deploy Chinese Oral Final to Netlify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate final site
        id: rebuild
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -euxo pipefail
            cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
            gzip -t /tmp/chinese-oral-final.tar.gz
            mkdir -p final-site
            tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site

            cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
            patch -d final-site -p1 < /tmp/dashboard-v8.patch

            cat deploy-v9/part-* | base64 -d | gzip -d > /tmp/v9-full.patch
            python - <<'PY'
          from pathlib import Path
          import re
          source = Path('/tmp/v9-full.patch').read_text(encoding='utf-8')
          chunks = re.split(r'(?=^diff -ruN )', source, flags=re.M)
          keep = []
          for chunk in chunks:
              first = chunk.splitlines()[0] if chunk.splitlines() else ''
              if ' a/public/' in first or ' a/netlify/' in first:
                  keep.append(chunk)
          Path('/tmp/v9-deploy.patch').write_text(''.join(keep), encoding='utf-8')
          PY
            patch --batch -d final-site -p1 < /tmp/v9-deploy.patch

            python - <<'PY'
          from pathlib import Path
          path = Path('final-site/public/index.html')
          text = path.read_text(encoding='utf-8')
          old = '<div class="compatibility-note"><span>ℹ️</span><p><strong>支持 Microsoft Edge、Google Chrome 和 iPhone Safari。</strong> Safari 若无法即时显示文字，录音结束后会自动进行云端转写。自动文字和反馈只供自主练习参考。</p></div>'
          new = '<div class="compatibility-note"><span>ℹ️</span><p><strong>支持 Microsoft Edge、Google Chrome。</strong></p></div>'
          if old not in text:
              raise SystemExit('Compatibility note to replace was not found.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

            node --check final-site/public/app.js
            grep -q '学习进度排行榜' final-site/public/index.html
            grep -q '<strong>支持 Microsoft Edge、Google Chrome。</strong>' final-site/public/index.html
            ! grep -q '支持 Microsoft Edge、Google Chrome 和 iPhone Safari' final-site/public/index.html
            grep -q 'CLOUD_TRANSCRIBE_ENDPOINT' final-site/public/app.js
            test -f final-site/netlify/functions/progress.mts
            test -f final-site/netlify/functions/transcribe.mts
          } 2>&1 | tee /tmp/rebuild-final.log

      - name: Deploy final version to Netlify
        id: deploy
        if: steps.rebuild.outcome == 'success'
        continue-on-error: true
        working-directory: final-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..6CBTqY1e1zdmudIp.1_-UAFhzA5rFYub02MzveJXRWbyouYNPjDOe7yO4E8PtqARHB20JWQy1dEmQAW3xle2TPvxe-BL4ZKX87w-7mma1w6-0M1gY5UW86pJlhnySAXUgjLBki88hO_j61qLY1ziigfZiHnKiAfMM30coT8hjYfBZGdWTu9tcLyL8ECMSTVEe9B3aUr4S9Ha9aMz6ekvbeWy7rIkvdTT3LhYkfu5LZz6OyZbefCMISAZrZ059DtT-syfCcGf40n4BIwh9x7gI1tiqL8EEW0ROOjKZuh5dqca4xSDXsfAvbgawQtmOXD5DBJnZ-5RyB7ZJNFIXntly41yBqO0oihX0nngebceuoVdI9_pI_1UofLtfk1vsWEtHW8DozRnwW8i5ZabXV8Z1OCs2.c661g3RM2dyg4ONCAR_m9w" \
            --no-wait 2>&1 | tee /tmp/netlify-final.log

      - name: Post deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral final deployment output'
            echo '#### Rebuild'
            echo '```text'
            tail -100 /tmp/rebuild-final.log 2>/dev/null || echo 'No rebuild output was produced.'
            echo '```'
            echo '#### Netlify'
            echo '```text'
            tail -100 /tmp/netlify-final.log 2>/dev/null || echo 'Deployment was not started.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/deploy-comment.md

      - name: Fail when build or deployment failed
        if: steps.rebuild.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: exit 1
