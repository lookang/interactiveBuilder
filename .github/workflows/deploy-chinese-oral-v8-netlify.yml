name: Deploy Chinese Oral V8 to Netlify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and validate final site
        shell: bash
        run: |
          set -euo pipefail
          cat deploy-v7/part-[0-9][0-9] | base64 -d > /tmp/chinese-oral-final.tar.gz
          gzip -t /tmp/chinese-oral-final.tar.gz
          mkdir -p final-site
          tar -xzf /tmp/chinese-oral-final.tar.gz -C final-site
          cat deploy-v8/patch-* > /tmp/dashboard-v8.patch
          patch -d final-site -p1 < /tmp/dashboard-v8.patch
          node --check final-site/public/app.js
          grep -q 'openTeacherDashboard' final-site/public/index.html
          grep -q 'teacher-dashboard-modal' final-site/public/styles.css
          test -f final-site/netlify/functions/progress.mts

      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: final-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app//proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..s9Wt5PFTjFmibU__.yX6WJucjcM1Muro2Y0tKp5CLsgm5X2C82gxZxLVPzOkEk-8eZUGHyMvMZo_FQurG7PAmNb-QvVTlelgLg26WSFakky-wnHgzQW3ZgQ3W887kq2EjBRinM3qauZpnBkoJEqF0a-aPHAH1Xlz9PFjuuDE66_Mv29GlShJsmNwHOMwlRp609q3-6CN4rB9SHWU9Oj0aTuKz3KNRfjbdDQ_acWIAjTGPbva1vi-uBfvb3aFS6G2tt_DJ2xDis4FfsF5mPPXAyg2jUNXK64a6k6KDTvcghTz__jEwi2200DNyHgNEZ61RGK87TV7hNzmF23u_qmNQ3ceQYrHF3xlZW_nnUSqGsXClZddPizyZ8jj5PIE36FXf52XsaaNBm72UvwpynVIpW3AQ.Lau3n-VXXpbQ3N7S9mwSjw" \
            --no-wait 2>&1 | tee /tmp/netlify-v8.log

      - name: Post deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Chinese Oral V8 Netlify deployment output'
            echo '```text'
            tail -100 /tmp/netlify-v8.log 2>/dev/null || echo 'No deployment output was produced.'
            echo '```'
          } > /tmp/deploy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/deploy-comment.md

      - name: Fail when deployment command failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
