name: Deploy Chinese Oral App

on:
  push:
    branches: [main]
    paths:
      - "chinese-oral-site/**"
      - ".github/workflows/deploy-chinese-oral-netlify.yml"
  pull_request:
    branches: [main]
    paths:
      - "chinese-oral-site/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        working-directory: chinese-oral-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
