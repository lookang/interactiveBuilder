name: Deploy Chinese Oral App

on:
  pull_request:
    branches: [main]
    paths:
      - "chinese-oral-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: chinese-oral-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app//proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..noHOHjGUzFN_K0Iy.vcALwyOv7Fl7VB1kbJHrUm-3SlRRG5KiQao-U6jKccfr1RB0EAuGMnedSGSKVcQ_tvuYWesQ_IRqoMST_en3PH6o_R1aarG2cKUs2r_k6ws8yhtcjJOclNn4ANwCmgOFg9kCQgZ4nkskJOmUl--3luppS41aIAVM3DjxwlHy-pv5Ez1xFjPGPHpqgJv5Pbx2tW8Et3AvKXinevQrrNILDlfAFmUxDcpyk96Q18zJgDOCxwgAKUfJFU-LXPVUzHZN9kZfQmZMvhpCoGTC_Rq0JeTsGfj2pbDgAguGdsZRhrEpic8mLt1qn1EPP4Wzi-MWkDcRB-KyHWwjpvm3g2d8gvdFa3bNML8AQJ8y23g3_ehd1cBufjV0LIGf42rTALKPTzbLklvk.y7YwKUWSpmIZXA3hDIwvOw" \
            --no-wait 2>&1 | tee /tmp/netlify-deploy.log
      - name: Post deployment result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Netlify deployment output'
            echo '```text'
            tail -80 /tmp/netlify-deploy.log 2>/dev/null || echo 'No deployment log was produced.'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail when deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
