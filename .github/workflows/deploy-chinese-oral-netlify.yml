name: Deploy Chinese Oral App

on:
  pull_request:
    branches: [main]
    paths:
      - "chinese-oral-site/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Netlify
        id: deploy
        continue-on-error: true
        working-directory: chinese-oral-site
        shell: bash
        run: |
          set -o pipefail
          npx -y @netlify/mcp@latest \
            --site-id 57387ad3-c718-430c-b3d9-4837072a1cd0 \
            --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..Uxi7kk4JI7N6X4ge.a4dDmryJvlrmTGKi6hHzjBtQJEP3_ocqcXZbJbtfph8u5NnAfjrq1jvwtuZvbMAWBJqzoLOVboAhLkaoIGeKkphRtVisBQcZuvKh98l6DBzOSUr6J_EoWL2UriquUxBMbS2cVeFubKPujus3unbO_oa6yJZk3HHEZktG_hrdOyEiKIbci4WALRgxc2eplrkHnEGwXJmylVp52grYBEvH2IYbGWKg5B4H3y5XXvu6gU80v6zFa1a8LxXEJp1542OoKJ-Ob3tFMlD7fzX49sYPf4MuIBNn4qY7dTLEN3dCEb6stIgbT27sHpqTm6Vy74m98fzVn4_gBkCWlLBg6lDRJCeuOqd7TiN5kzufQ2KzhMQjqy0HdmNrlZi1GBukepjGsQo1Av0j._F_ej6V3RMO2noATN6G0gA" \
            --no-wait 2>&1 | tee /tmp/netlify-deploy.log
      - name: Post deployment result
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Netlify deployment output'
            echo '```text'
            tail -80 /tmp/netlify-deploy.log 2>/dev/null || echo 'No deployment log was produced.'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
      - name: Fail when deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
