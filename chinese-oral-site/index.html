<style>
:root{--b:#1769d2;--bg:#f4f8fd;--card:#fff;--text:#18324a;--muted:#60758a;--ok:#138a55;--warn:#c56b00;--bad:#c43d4b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#1769d2,#39a1e8);color:#fff;padding:24px}header h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}header p{margin:0;opacity:.92}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid #dce6ef;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #1232 0}.profile{display:grid;grid-template-columns:1fr 160px auto;gap:10px;align-items:end}label{font-weight:700;font-size:14px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #b8c9d8;border-radius:10px;padding:11px;background:#fff}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer;background:#e6eef7;color:var(--text)}button.primary{background:var(--b);color:#fff}button.danger{background:#fff0f1;color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button.active{background:var(--b);color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.side{position:sticky;top:12px;align-self:start}.passage{font-size:22px;line-height:2.05;background:#f8fbfe;border-radius:12px;padding:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{padding:10px 12px;background:#eef6ff;border-radius:10px;margin:10px 0;color:#255274}.qcard{border:1px solid #cddbe7;border-radius:14px;padding:14px;margin:12px 0}.qcard.active{border:2px solid var(--b);background:#f5faff}.qhead{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.qtext{font-size:19px;font-weight:800;line-height:1.55}.badge{font-size:12px;background:#e8f2ff;color:#145ab0;border-radius:999px;padding:4px 8px;white-space:nowrap}.recording{background:#d9364f!important;color:#fff!important}.answerbox{margin-top:12px}.feedback{border-left:5px solid var(--b);background:#f4f8fc;border-radius:10px;padding:12px;margin-top:12px}.feedback.ok{border-color:var(--ok)}.feedback.warn{border-color:var(--warn)}.feedback.bad{border-color:var(--bad)}.model{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.model div{background:#eef4fb;border-radius:10px;padding:9px;text-align:center;font-size:13px}.model b{display:block;font-size:20px;color:var(--b)}details{border:1px solid #d3e0ea;border-radius:12px;padding:12px;margin-top:14px}summary{font-weight:800;cursor:pointer}.sample{white-space:pre-line;line-height:1.75}.small{font-size:13px;color:var(--muted)}.overall h3{margin-top:0}.progress{font-weight:800;color:var(--ok)}audio{width:100%;margin-top:8px}@media(max-width:760px){.profile,.grid{grid-template-columns:1fr}.side{position:static}.model{grid-template-columns:1fr 1fr}.qhead{display:block}.qhead .row{margin-top:8px}}

<body>
<header><div class="wrap"><h1>华文口语练习小助手</h1><p>小五、小六朗读与口语会话自主练习</p></div></header>
<main class="wrap">
<section class="card profile"><div><label>姓名</label><input id="name" placeholder="例如：Tan Mei Li"></div><div><label>班级</label><input id="className" placeholder="例如：6A"></div><button id="saveProfile" class="primary">确认／载入进度</button></section>
<p id="profileNote" class="small">每次请使用相同的姓名和班级，系统会在同一浏览器继续累积进度。</p>
<div class="tabs"><button data-tab="reading">📖 朗读练习</button><button data-tab="oral" class="active">💬 口语会话</button><button id="micTest">🎙️ 测试麦克风</button></div>
<section id="reading" class="hidden">
<div class="grid"><aside class="card side"><label>年级</label><select id="grade"><option>P5</option><option>P6</option></select><label>篇章</label><select id="passageSelect"></select><p class="small">点击范读可播放或停止；录音后可听回。</p></aside><div class="card"><h2 id="passageTitle"></h2><div id="passageText" class="passage"></div><div class="row" style="margin-top:14px"><button id="readAloud">🔊 播放范读</button><button id="readRecord" class="primary">🎙️ 开始录音</button></div><div id="readStatus" class="status">准备好后开始朗读。</div><audio id="readAudio" controls class="hidden"></audio><textarea id="readTranscript" placeholder="语音识别文字会显示在这里，也可以自行修正。"></textarea><button id="readFeedback">检查朗读反馈</button><div id="readResult"></div></div></div>
</section>
<section id="oral">
<div class="grid"><aside class="card side"><label>选择话题</label><select id="topicSelect"></select><p id="topicProgress" class="progress"></p><p class="small">依次听题、回答和录音。完成所有问题后，系统会综合反馈。</p></aside><div><div class="card"><h2 id="topicTitle"></h2><p id="topicIntro"></p><div class="model"><div><b>看法</b>清楚回应</div><div><b>原因</b>说明为什么</div><div><b>解释</b>深入说明</div><div><b>经历</b>举例分享</div><div><b>建议</b>提出做法</div></div><div id="questions"></div><details><summary>查看较完整的参考答案</summary><div class="row" style="margin:10px 0"><button id="sampleAudio">🔊 听参考答案</button></div><div id="sample" class="sample"></div></details></div><div id="overall" class="card overall hidden"></div></div></div>
</section>
</main><div id="toast" style="position:fixed;right:18px;bottom:18px;background:#17324c;color:#fff;padding:12px 16px;border-radius:10px;display:none"></div>
<script>
const R={P5:[{t:'一次有意义的露营',x:'学校假期里，我参加了童军露营。出发前，老师提醒我们准备手电筒、睡袋和防蚊用品，也不要单独离开营地。晚上，我们围着营火分享故事。虽然天气炎热，大家仍互相帮助。我从这次活动中学会了独立，也明白团队合作的重要。'},{t:'诚实的选择',x:'放学后，我在小贩中心发现一个钱包。虽然四周没有人，我没有把它占为己有，而是交给服务台。失主回来认领时十分感激。我也感到很高兴，因为诚实不但能帮助别人，也让自己问心无愧。'}],P6:[{t:'善用人工智能学习',x:'人工智能可以帮助我们整理资料、解释难题和提供练习建议。不过，我们不能直接抄写答案，也要检查资料是否准确。使用人工智能时，我们不应该输入姓名、地址或密码等个人资料。只有保持思考和判断，人工智能才能成为有用的学习助手。'},{t:'丰富的校园生活',x:'校园不只是上课的地方，也是我们培养兴趣、结交朋友和服务社会的舞台。参加课外活动能学习新技能，社区服务能培养责任感，学校庆祝活动则让我们认识不同文化。丰富的校园生活使我们更有自信，也学会与人合作。'}]};
const T=[
['学习独立',['你觉得自己独立吗？请说一说。','如果朋友不会独立，你会怎么帮助他？','家长可以怎样培养孩子独立？'],'独立能减轻父母负担，也能培养责任感。我会自己整理书包、安排时间、完成作业和做简单家务。朋友如果过分依赖别人，我会先鼓励他从一件小事开始，例如每天收拾房间。家长可以给予孩子适当任务，让他们尝试解决问题，而不是事事代劳。'],
['正直与诚实',['请分享一件你做过的诚实的事。','父母怎样教导孩子诚实？','学校可以怎样培养诚实品德？'],'有一次老师把我的分数算高了，我主动说明并请老师改正。我认为诚实能得到别人的信任。父母应以身作则，孩子犯错时也要鼓励他说实话。学校可以分享真实故事、表扬诚实行为，并通过角色扮演让学生思考正确选择。'],
['补习与自主学习',['你认为参加补习课有帮助吗？','什么情况下你会建议同学补习？','学生怎样培养自主学习？'],'补习是否有帮助要看学生的需要。基础较弱或缺少指导的学生可能从补习中得到帮助，但学习能力较强的学生可以先专心上课、及时提问和定期温习。最重要的是建立时间表，主动找出不明白的地方，并选择适合自己的学习方法。'],
['减少食物浪费',['你看过哪些浪费食物的行为？','我们怎样减少食物浪费？','学校可以做什么？'],'我看过有人点太多食物，吃不完就倒掉。我们应该按食量购买，吃不完可以打包，也可以要求少饭少面。学校可通过海报、食物垃圾统计和珍惜食物活动，让学生了解每份食物都需要许多人的劳动。'],
['运动与健康',['你平时做什么运动？','怎样鼓励不爱运动的同学？','社会如何鼓励人们运动？'],'我每周跑步和打羽毛球。运动能强身健体，也能帮助我放松和减轻压力。我会邀请不爱运动的同学从简单活动开始。学校和社区可以举办有趣的亲子运动、步行挑战和球类活动，让运动成为生活习惯。'],
['培养阅读习惯',['你喜欢阅读吗？有什么好处？','学校怎样鼓励阅读？','你会推荐哪类书？'],'阅读能增加知识、提升语文能力，也能让我们放松。学校可安排固定阅读时间、好书分享、角色扮演和阅读比赛。选择书籍时可以从兴趣出发，再逐渐接触不同题材。'],
['关怀家人',['家人怎样关心你？','家人不开心时你会怎么做？','家人之间怎样互相关怀？'],'家人会关心我的学习和健康，我感到幸福。家人不开心时，我会先聆听，再陪伴或帮忙解决问题。我们也可以分担家务、主动问候、一起用餐，让彼此感受到关心。'],
['家庭凝聚力',['你和家人常进行什么活动？','社区可举办什么家庭活动？','为什么家庭凝聚力重要？'],'我们会一起吃晚餐、运动和探望祖父母。这些活动增加沟通和共同回忆。社区可举办亲子烹饪、家庭运动会和三代同堂活动。关系紧密的家庭能在遇到困难时互相支持。'],
['学习之旅',['分享一次学习之旅和收获。','参加学习之旅要注意什么？','学校还能举办什么学习之旅？'],'我参加过植物园学习之旅，用平板记录不同植物。这让我学到课室外的知识。外出时要注意安全、守秩序和保持环境清洁。学校也可按学科安排博物馆、超市或文化区学习活动。'],
['种族和谐日',['学校怎样庆祝种族和谐日？','你从活动中学到什么？','我们怎样尊重不同文化？'],'学校通过传统服装、美食、音乐和游戏介绍不同文化。我学会尊重差异，也明白和谐需要包容和沟通。与不同种族相处时，要避免取笑他人的语言、宗教和习俗，并主动了解彼此。'],
['爱护学校环境',['学生怎样爱护校园？','看到同学破坏环境时怎么办？','学校可以举办什么活动？'],'我们不乱丢垃圾、不破坏公物，并主动保持课室整洁。看到不当行为时，我会礼貌劝阻，必要时告诉老师。学校可举办清洁班级比赛、环保宣传和校园服务活动。'],
['课外辅助活动',['你参加什么课外活动？有什么收获？','有人认为课外活动浪费时间，你怎么看？','怎样平衡课业与活动？'],'课外活动让我学习技能、结交朋友和培养团队精神。它不会必然影响成绩，关键是合理安排时间。我会先完成重要任务，再参加训练，并在考试前调整时间。'],
['公德心',['分享一个没有公德心的行为。','你看到时会怎么做？','家长和学校怎样培养公德心？'],'乱丢垃圾、插队和制造噪音都会影响别人。我会先礼貌提醒，若情况严重则寻求大人协助。家长和老师应以身作则，并让学生理解行为对社会的影响。'],
['为他人着想',['分享一件为他人着想的事。','你看过什么自私行为？','学校怎样鼓励体贴他人？'],'我曾在拥挤的食阁移开书包，让别人有座位。为他人着想就是先考虑自己的行为会不会造成不便。学校可通过主题周、榜样分享和服务活动，让学生把体贴化为行动。'],
['公共场所礼仪',['你看过什么不良公共行为？','同学在校门口大吵时怎么办？','为什么要注意公共行为？'],'公共场所大声喧哗、插队或乱丢垃圾会干扰别人。我会礼貌提醒同学，因为穿着校服时也代表学校。良好礼仪能让共享空间更安全、更舒适。'],
['多元文化社会',['新加坡如何体现多元文化？','不同群体怎样和谐相处？','青少年可以做什么？'],'我国有不同语言、节日、宗教场所和文化活动。和谐不是只有庆祝一天，而是日常互相尊重、沟通和帮助。青少年可以学习基本问候语、参加跨文化活动，并避免传播刻板印象。'],
['金钱管理',['你怎样管理零用钱？','怎样分辨需要和想要？','为什么储蓄重要？'],'我会先记录开支，把一部分零用钱储蓄起来，再决定可以花多少。购买前要问自己是否真正需要。储蓄能帮助我们应付紧急情况和实现较大的目标，也培养自律。'],
['假期生活',['你会怎样安排假期？','怎样让假期充实而不过度忙碌？','你想学习什么新技能？'],'我会安排阅读、运动、学习新技能、陪伴家人和适当休息。计划要有弹性，不必把每一天排满。我想学习绘画，也会参加社区服务，让假期既快乐又有意义。'],
['时间管理',['你怎样安排每天的时间？','怎样避免拖延？','计划改变时怎么办？'],'我会列出任务并先完成重要的功课，同时安排休息。避免拖延的方法是把大任务分成小步骤并马上开始。遇到突发情况时，我会调整时间表，而不是放弃计划。'],
['丰富的校园生活',['你的校园生活丰富吗？','哪些活动让你成长？','学校还可增加什么活动？'],'校园活动让我培养兴趣、合作能力和责任感。课外活动、社区服务、节日庆祝和学科比赛都有不同收获。学校还可增加学生策划的兴趣活动，让更多同学参与。'],
['人工智能与学习',['你怎样使用人工智能学习？','使用人工智能有什么好处和风险？','学生应遵守什么原则？'],'人工智能可以解释概念、提供练习和帮助整理想法，但答案可能不准确。学生必须核对资料、保护个人信息，并用自己的语言表达。我们应该让人工智能支持思考，而不是代替思考。'],
['负责任使用手机',['手机怎样帮助学习？','过度使用手机有什么影响？','你会怎样自我管理？'],'手机可以查资料、拍摄学习记录和联系家人，但过度使用会影响睡眠、专注和面对面交流。我会设定使用时间，做功课时关闭通知，也不会在不适当的场合玩手机。'],
['网络安全',['怎样保护个人资料？','收到陌生链接怎么办？','发现网络欺凌时怎么做？'],'我不会公开密码、地址或学校资料，也会使用较强密码。陌生链接不随便点击，要先请教大人。遇到网络欺凌时，应保存证据、停止回应并向可信任的大人求助。'],
['关爱乐龄人士',['乐龄人士可能面对什么困难？','你可以怎样帮助？','社区可以做什么？'],'一些老人行动较慢、感到孤单或不熟悉科技。我们可以让座、耐心沟通、协助使用手机和定期探访。社区可举办跨代活动和数码学习班。'],
['环保生活',['怎样减少一次性用品？','学校和家庭可以怎样环保？','为什么个人行动有意义？'],'我会自带水瓶、餐盒和购物袋，减少一次性用品。学校可设置分类回收和环保挑战，家庭则可节约水电。一个人的行动看似微小，但许多人坚持就能产生明显影响。'],
['面对挫折与压力',['你怎样面对失败？','考试压力大时怎么办？','怎样帮助焦虑的同学？'],'失败能让我们发现不足。我会先冷静，分析问题，再制定小目标。压力大时要适当休息、运动并向家人老师求助。帮助同学时应先聆听，不取笑，也鼓励他寻找可靠支持。']
].map((x,i)=>({title:x[0],questions:x[1],sample:x[2],intro:'请依次回答每一道问题。每题录音后，最后会收到整体反馈。'}));
let profile=null,topic=0,answers=[],media=null,chunks=[],stream=null,recQ=-1,recognition=null,speaking='';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(x){let t=$('#toast');t.textContent=x;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2600)}
function key(){return ((profile?.name||'')+'::'+(profile?.cls||'')).trim().toLowerCase()}
function save(){if(profile)localStorage.setItem('oral:'+key(),JSON.stringify(profile))}
function loadProfile(){let n=$('#name').value.trim(),c=$('#className').value.trim();if(!n||!c)return toast('请输入姓名和班级。');let k=(n+'::'+c).toLowerCase(),old=JSON.parse(localStorage.getItem('oral:'+k)||'null');profile=old||{name:n,cls:c,topics:[],reading:[]};profile.name=n;profile.cls=c;save();$('#profileNote').textContent=`当前档案：${n}（${c}）。下次使用相同姓名和班级会继续累积进度。`;renderTopic();toast(old?'已载入累计进度。':'已建立学生档案。')}
function speak(text,id){if(!('speechSynthesis'in window))return toast('浏览器不支持语音播放。');if(speaking===id){speechSynthesis.cancel();speaking='';renderTopic();return}speechSynthesis.cancel();speaking=id;let u=new SpeechSynthesisUtterance(text);u.lang='zh-SG';u.rate=.82;u.onend=u.onerror=()=>{speaking='';renderTopic()};speechSynthesis.speak(u);renderTopic()}
async function getMic(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(e.name==='NotAllowedError'?'麦克风权限被阻止。请在地址栏旁允许麦克风后刷新。':'无法使用麦克风：'+e.message);throw e}}
async function testMic(){try{let s=await getMic();toast('麦克风可用。');setTimeout(()=>s.getTracks().forEach(t=>t.stop()),1000)}catch{}}
function startRecognition(i){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang='zh-SG';recognition.continuous=true;recognition.interimResults=true;recognition.onresult=e=>{let x='';for(let j=e.resultIndex;j<e.results.length;j++)if(e.results[j].isFinal)x+=e.results[j][0].transcript;answers[i].text+=(x?' '+x:'');let ta=document.querySelector(`[data-text="${i}"]`);if(ta)ta.value=answers[i].text.trim()};try{recognition.start()}catch{}}
async function toggleRecord(i,type='oral'){if(media&&media.state==='recording'){stopRecord();return}try{stream=await getMic();chunks=[];recQ=i;media=new MediaRecorder(stream);media.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};media.onstop=()=>{let blob=new Blob(chunks,{type:media.mimeType||'audio/webm'}),url=URL.createObjectURL(blob);if(type==='oral'){answers[i].audio=url;answers[i].done=true}else{$('#readAudio').src=url;$('#readAudio').classList.remove('hidden')}stream?.getTracks().forEach(t=>t.stop());stream=null;recQ=-1;renderTopic();};media.start();if(type==='oral')startRecognition(i);else startReadRecognition();renderTopic();toast('正在录音，完成后再按一次停止。')}catch{}}
function stopRecord(){try{recognition?.stop()}catch{}recognition=null;if(media?.state==='recording')media.stop()}
function startReadRecognition(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang='zh-SG';recognition.continuous=true;recognition.onresult=e=>{for(let j=e.resultIndex;j<e.results.length;j++)if(e.results[j].isFinal)$('#readTranscript').value+=' '+e.results[j][0].transcript};try{recognition.start()}catch{}}
function renderTopic(){let t=T[topic];$('#topicSelect').innerHTML=T.map((x,i)=>`<option value="${i}" ${i===topic?'selected':''}>${profile?.topics?.includes(i)?'✓ ':''}${i+1}. ${x.title}</option>`).join('');$('#topicTitle').textContent=t.title;$('#topicIntro').textContent=t.intro;$('#sample').textContent=t.sample;$('#sampleAudio').textContent=speaking==='sample'?'⏹ 停止朗读':'🔊 听参考答案';$('#topicProgress').textContent=profile?`已完成 ${profile.topics.length} / ${T.length} 个话题`:'';if(answers.length!==t.questions.length)answers=t.questions.map(()=>({text:'',audio:'',done:false}));$('#questions').innerHTML=t.questions.map((q,i)=>`<div class="qcard ${recQ===i?'active':''}"><div class="qhead"><div><span class="badge">第 ${i+1} 题</span><div class="qtext">${q}</div></div><div class="row"><button data-listen="${i}">${speaking==='q'+i?'⏹ 停止':'🔊 听题'}</button><button class="primary ${recQ===i?'recording':''}" data-rec="${i}">${recQ===i?'⏹ 停止录音':'🎙️ 回答这题'}</button></div></div><div class="answerbox"><textarea data-text="${i}" placeholder="语音识别文字会显示在这里；如有误，可自行修正。">${answers[i].text||''}</textarea>${answers[i].audio?`<audio controls src="${answers[i].audio}"></audio>`:''}<button data-save="${i}">保存这题文字</button></div></div>`).join('');let complete=answers.every(a=>a.done||a.text.trim().length>8);if(complete)showOverall();else $('#overall').classList.add('hidden')}
function metrics(x){return {op:/我认为|我觉得|我的看法|我赞成|我不赞成/.test(x),reason:/因为|由于|原因/.test(x),explain:/因此|所以|如果|影响|结果|这样/.test(x),experience:/例如|比如|有一次|我曾经|记得/.test(x),suggest:/应该|可以|建议|我会|不应该/.test(x)}}
function showOverall(){let t=T[topic],all=answers.map(a=>a.text.trim()).join(' '),m=metrics(all),used=Object.values(m).filter(Boolean).length,short=answers.map((a,i)=>({i,len:a.text.replace(/\s/g,'').length})).sort((a,b)=>a.len-b.len)[0],missing=[];if(!m.op)missing.push('先清楚表明看法或感受');if(!m.reason)missing.push('补充原因，并说明为什么');if(!m.explain)missing.push('深入说明影响、结果或道理');if(!m.experience)missing.push('加入个人经历或具体例子');if(!m.suggest)missing.push('提出可行的建议或做法');let tips=answers.map((a,i)=>{let len=a.text.replace(/\s/g,'').length;return `<div class="feedback ${len>55?'ok':len>25?'warn':'bad'}"><b>第 ${i+1} 题：</b>${len>55?'回答较完整，继续注意语气和衔接。':len>25?'已经回应问题，可再加入原因或例子。':'回答较短，请直接回应问题，并至少加入一个原因或例子。'}</div>`}).join('');$('#overall').innerHTML=`<h3>整套口语反馈</h3><p>你完成了 ${answers.length} 题，并运用了 ${used}/5 个表达方向。</p>${tips}<div class="feedback warn"><b>下一步：</b>${missing.length?missing.slice(0,2).join('；'):'整体内容较完整，可重录最短的一题并改善语气、停顿和衔接。'}</div><div class="feedback"><b>从参考答案学习：</b>${t.sample}</div><p><b>建议重练：</b>第 ${short.i+1} 题，因为这一题目前最短。</p>`;$('#overall').classList.remove('hidden');if(profile&&!profile.topics.includes(topic)){profile.topics.push(topic);save();$('#topicProgress').textContent=`已完成 ${profile.topics.length} / ${T.length} 个话题`}}
function renderReading(){let g=$('#grade').value,a=R[g];$('#passageSelect').innerHTML=a.map((p,i)=>`<option value="${i}">${i+1}. ${p.t}</option>`).join('');showPassage()}
function showPassage(){let p=R[$('#grade').value][+$('#passageSelect').value||0];$('#passageTitle').textContent=p.t;$('#passageText').textContent=p.x;$('#readResult').innerHTML=''}
function readFeedback(){let txt=$('#readTranscript').value.trim(),target=R[$('#grade').value][+$('#passageSelect').value||0].x;if(!txt)return toast('请先录音或输入识别文字。');let chars=[...new Set(target.replace(/[，。！？、；：\s]/g,''))],hit=chars.filter(c=>txt.includes(c)).length,score=Math.round(hit/chars.length*100);$('#readResult').innerHTML=`<div class="feedback ${score>75?'ok':score>50?'warn':'bad'}"><b>识读参考：${score}%</b><p>${score>75?'大部分内容都读到了。请听回录音，继续注意停顿和语气。':'有些字词可能没有被清楚识别。请再听范读，分句慢读一次。'}</p><small>浏览器语音识别只能作为练习参考，不能完全代表真实发音准确度。</small></div>`}
$$('[data-tab]').forEach(b=>b.onclick=()=>{$$('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#reading').classList.toggle('hidden',b.dataset.tab!=='reading');$('#oral').classList.toggle('hidden',b.dataset.tab!=='oral')});$('#saveProfile').onclick=loadProfile;$('#micTest').onclick=testMic;$('#topicSelect').onchange=e=>{topic=+e.target.value;answers=[];speechSynthesis.cancel();speaking='';renderTopic()};$('#questions').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.listen!==undefined)speak(T[topic].questions[+b.dataset.listen],'q'+b.dataset.listen);if(b.dataset.rec!==undefined)toggleRecord(+b.dataset.rec);if(b.dataset.save!==undefined){let i=+b.dataset.save;answers[i].text=document.querySelector(`[data-text="${i}"]`).value.trim();answers[i].done=answers[i].text.length>8;renderTopic();toast('已保存这题。')}};$('#questions').oninput=e=>{if(e.target.dataset.text!==undefined)answers[+e.target.dataset.text].text=e.target.value};$('#sampleAudio').onclick=()=>speak(T[topic].sample,'sample');$('#grade').onchange=renderReading;$('#passageSelect').onchange=showPassage;$('#readAloud').onclick=()=>{let p=R[$('#grade').value][+$('#passageSelect').value||0];speak(p.x,'reading')};$('#readRecord').onclick=()=>toggleRecord(-1,'reading');$('#readFeedback').onclick=readFeedback;renderReading();renderTopic();
</script></body></html>
